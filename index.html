<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>They Call me MIKU</title>
  <style>
    html,
    body {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-image: linear-gradient(135deg, rgba(10, 14, 30, 0.6), rgba(25, 38, 58, 0.2)), url('https://i.redd.it/bm0sfj1ni9we1.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: transparent;
    }

    #chat {
      position: fixed;
      right: clamp(12px, 2vw, 26px);
      bottom: clamp(12px, 2vw, 20px);
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 32px);
      z-index: 10;
      background: rgba(20, 20, 35, 0.95);
      color: white;
      padding: 15px;
      border-radius: 15px;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      transition: width 0.25s ease, transform 0.25s ease;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-button {
      flex: 1;
      width: 44px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mode-button.active {
      background: rgba(96, 102, 255, 0.4);
      color: white;
      border-color: rgba(157, 165, 255, 0.7);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages {
      height: clamp(120px, 28vh, 220px);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
    }

    #chat-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 700px) {
      #chat {
        width: auto;
        min-width: 94px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(25, 25, 38, 0.82);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }

      #chat .chat-panel {
        display: none;
      }

      #chat.is-open {
        width: min(320px, calc(100vw - 16px));
        border-radius: 18px;
        padding: 12px;
      }

      #chat.is-open .chat-panel {
        display: flex;
      }

      #chat-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        inset: auto;
        width: auto;
        min-width: 78px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #chat.is-open #chat-toggle {
        margin-bottom: 10px;
      }
    }

    .ai-message,
    .user-message {
      padding: 9px;
      margin-bottom: 8px;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .ai-message {
      background: #383858;
    }

    .user-message {
      background: #6251a5;
      text-align: right;
    }

    #chat-form {
      display: flex;
      gap: 8px;
    }

    #question {
      min-width: 0;
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    #send {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
          "@pixiv/three-vrm-animation": "/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
        }
      }
    </script>
</head>

<body>
  <div id="chat">
    <button id="chat-toggle" type="button" aria-label="Toggle chat">Chat</button>

    <div class="chat-panel">
      <div class="mode-switch" role="tablist" aria-label="Interaction mode">
        <button class="mode-button active" type="button" data-mode="text" aria-label="Text chat">💬</button>
        <button class="mode-button" type="button" data-mode="voice" aria-label="Voice mode">🎙️</button>
      </div>

      <div id="messages"></div>

      <form id="chat-form" style="display: none;">
        <input id="question" type="text" placeholder="Ask Miku anything..." autocomplete="off" required />
        <button type="submit" id="send">Send</button>
      </form>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
